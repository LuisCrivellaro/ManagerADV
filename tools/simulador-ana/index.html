<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Simulador da Ana</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: conversa do cliente à esquerda (protagonista), bastidores à direita; empilha no celular. Identidade CS Lawyers do Manager ADV. */
:root{
  --bg:#F4F7F7; --surface:#FFFFFF; --ink:#0D1F1E; --muted:#5A6B6A; --line:#D7E3E2;
  --petroleo:#0F3533; --aqua:#007F7B; --aqua-hover:#006A67; --aqua-soft:#E9F7F6; --aqua-line:#CFE9E7;
  --chat-bg:#E6EEED; --bolha-cli:#D8F0EE; --bolha-ana:#FFFFFF;
  --ok:#1D7A4E; --ok-soft:#E3F3EA; --alerta:#8A5A00; --alerta-soft:#FFF4D6; --perigo:#B42318; --perigo-soft:#FDECEA;
  --font-serif:"EB Garamond",Georgia,serif; --font-sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1716; --surface:#11211F; --ink:#E4EFEE; --muted:#93A8A6; --line:#22403D;
  --petroleo:#0A2422; --aqua:#2FB3AD; --aqua-hover:#4CC5BF; --aqua-soft:#143331; --aqua-line:#1F4744;
  --chat-bg:#0E1D1C; --bolha-cli:#164240; --bolha-ana:#172B29;
  --ok:#5CCB93; --ok-soft:#163327; --alerta:#E7B44C; --alerta-soft:#33290F; --perigo:#F2877C; --perigo-soft:#3A1A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1716; --surface:#11211F; --ink:#E4EFEE; --muted:#93A8A6; --line:#22403D;
  --petroleo:#0A2422; --aqua:#2FB3AD; --aqua-hover:#4CC5BF; --aqua-soft:#143331; --aqua-line:#1F4744;
  --chat-bg:#0E1D1C; --bolha-cli:#164240; --bolha-ana:#172B29;
  --ok:#5CCB93; --ok-soft:#163327; --alerta:#E7B44C; --alerta-soft:#33290F; --perigo:#F2877C; --perigo-soft:#3A1A17; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font-sans);-webkit-font-smoothing:antialiased}
button,textarea,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
header.topo{background:var(--petroleo);color:#EAF4F3;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px}
.marca{display:flex;flex-direction:column;gap:2px;min-width:0}
.marca .sup{font:600 11px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:#7FD3CF}
.marca h1{margin:0;font:600 24px/1.1 var(--font-serif);letter-spacing:-.005em;text-wrap:balance}
.topo .ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-left:auto}
.topo select{background:#173F3C;border:1px solid #2C5B57;border-radius:6px;padding:6px 8px;color:#EAF4F3}
.topo .btn{background:transparent;border-color:#2C5B57;color:#EAF4F3}
.topo .btn:hover{background:#173F3C}
#aviso-modelo{background:var(--alerta-soft);color:var(--alerta);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:13px}
main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto;height:calc(100% - 64px)}
@media (max-width:900px){main{grid-template-columns:1fr;height:auto}.conversa{height:78vh}}
.conversa,.lado{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;min-width:0}
.conv-cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--aqua);color:#fff;display:grid;place-items:center;font:600 15px var(--font-serif)}
.conv-cab .quem{display:flex;flex-direction:column;line-height:1.25}
.conv-cab .quem b{font-weight:600}
.conv-cab .quem span{font-size:12px;color:var(--muted)}
#estado{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto;align-items:center}
#chat{flex:1;overflow-y:auto;background:var(--chat-bg);padding:16px 14px;display:flex;flex-direction:column;gap:10px;min-height:240px}
.vazio{margin:auto;max-width:44ch;text-align:center;color:var(--muted)}
.vazio .vazio-tit{font:600 20px/1.2 var(--font-serif);color:var(--ink);margin:0 0 6px}
.msg{display:flex;flex-direction:column;max-width:82%;gap:3px}
.msg.cliente{align-self:flex-end;align-items:flex-end}
.msg.ana,.msg.retida{align-self:flex-start}
.bolha{padding:9px 12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.cliente .bolha{background:var(--bolha-cli);border-bottom-right-radius:4px}
.ana .bolha{background:var(--bolha-ana);border-bottom-left-radius:4px}
.retida .bolha{background:var(--alerta-soft);border:1px dashed var(--alerta);border-bottom-left-radius:4px}
.retida-tit{font-size:12px;font-weight:600;color:var(--alerta)}
.msg.sel .bolha{outline:2px solid var(--aqua);outline-offset:1px}
.bolha a{color:var(--aqua)}
.meta{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.lnk{background:none;border:0;padding:0;color:var(--aqua);cursor:pointer;font-size:12px;text-decoration:underline;text-underline-offset:2px}
.lnk:disabled{color:var(--muted);cursor:default;text-decoration:none}
.lnk.anotar{color:var(--muted)}
.nota{align-self:center;max-width:90%;text-align:center;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.nota.erro{color:var(--perigo);background:var(--perigo-soft);border-color:transparent;border-radius:8px}
.digitando .pontos::after{content:"…";animation:pisca 1.2s infinite}
@keyframes pisca{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.digitando .pontos::after{animation:none}}
.anot{display:flex;flex-direction:column;gap:6px;width:min(420px,78vw);margin-top:4px}
.anot textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);resize:vertical}
.anot-acoes{display:flex;gap:6px}
.ok{color:var(--ok);font-size:13px}
#cenarios{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-top:1px solid var(--line);scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--aqua-line);background:var(--aqua-soft);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--aqua)}
#form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:flex-end}
#entrada{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg);max-height:140px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--aqua)}
.btn.pri{background:var(--aqua);border-color:var(--aqua);color:#fff}
.btn.pri:hover{background:var(--aqua-hover)}
.btn:disabled{opacity:.5;cursor:default}
.btn.mini{padding:3px 9px;font-size:12px}
.abas{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.abas button{border:0;background:none;padding:9px 12px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.abas button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--aqua)}
.painel{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-height:0}
.sub{color:var(--muted);font-size:13px;margin:0}
.vazio-p{color:var(--muted);margin:24px 0;text-align:center}
.linha{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.linha.fim{justify-content:flex-end}
.bloco{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.bloco h3{margin:0;font:600 17px/1.2 var(--font-serif)}
.campo{display:flex;flex-direction:column;gap:2px;min-width:0}
.campo .rot{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.campo .val{white-space:pre-wrap;overflow-wrap:anywhere}
.campo.destaque .val{font-size:15px}
.campo.perigo .val{color:var(--perigo)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.alerta{background:var(--alerta-soft);color:var(--alerta)}
.pill.perigo{background:var(--perigo-soft);color:var(--perigo)}
.pill.neutro{background:var(--aqua-soft);color:var(--aqua)}
.pill.mini{margin-left:8px;font-size:11px;padding:1px 7px}
.aviso{margin:0;font-size:13px;color:var(--alerta);background:var(--alerta-soft);padding:6px 10px;border-radius:6px}
.eventos{margin:0;padding-left:18px}
.tec summary{cursor:pointer;color:var(--muted);font-size:13px}
.tec[open]{display:flex;flex-direction:column;gap:8px}
pre{margin:0;max-height:260px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;font:12px/1.45 var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere}
.agenda{display:flex;flex-direction:column}
.agenda .dia{font-weight:600;margin-top:10px;padding-bottom:4px;border-bottom:1px solid var(--line);text-transform:capitalize}
.ev{display:flex;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line)}
.ev .h{font-variant-numeric:tabular-nums;color:var(--muted);min-width:96px}
.ev.ana{color:var(--ok);font-weight:600}
.ev.ana .h{color:var(--ok)}
.chk{display:flex;align-items:center;gap:6px;cursor:pointer}
.grupo{display:flex;flex-direction:column;gap:4px}
.rot-campo{font-weight:600}
.grupo textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);resize:vertical;font-size:13px;line-height:1.45}
.ajuda{margin:0;font-size:12px;color:var(--muted);white-space:pre-line;flex:1;min-width:0}
.anot-card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.anot-card .problema{margin:0;font-weight:600}
.anot-card .meta-t{font-size:12px;color:var(--muted)}
.cit{display:flex;flex-direction:column;gap:1px;font-size:13px;border-left:2px solid var(--aqua-line);padding-left:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.cit .rot{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.rodape{color:var(--muted);font-size:12px;padding:0 16px 14px}
</style>
</head>
<body>
<header class="topo">
  <div class="marca">
    <span class="sup">CS Lawyers · Manager ADV</span>
    <h1>Simulador da Ana</h1>
  </div>
  <div class="ctrl">
    <label class="sr" for="perfil">Perfil do contato</label>
    <select id="perfil">
      <option value="novo">Novo contato</option>
      <option value="cliente">Contato que já é cliente</option>
    </select>
    <button id="nova" class="btn" type="button">Nova conversa</button>
  </div>
</header>
<div id="aviso-modelo" hidden></div>
<main>
  <section class="conversa" aria-label="Conversa no Telegram de teste">
    <div class="conv-cab">
      <div class="avatar" aria-hidden="true">A</div>
      <div class="quem"><b>Ana · CS Lawyers</b><span>Telegram de teste · simulação</span></div>
      <div id="estado"></div>
    </div>
    <div id="chat" role="log" aria-live="polite"></div>
    <div id="cenarios" aria-label="Cenários prontos"></div>
    <form id="form">
      <label class="sr" for="entrada">Mensagem do cliente</label>
      <textarea id="entrada" rows="1" placeholder="Escreva como o cliente…"></textarea>
      <button id="enviar" class="btn pri" type="submit">Enviar</button>
    </form>
  </section>
  <section class="lado" aria-label="Bastidores">
    <div class="abas" role="tablist">
      <button type="button" role="tab" data-aba="turno" aria-selected="true">Bastidores</button>
      <button type="button" role="tab" data-aba="anotacoes" aria-selected="false">Anotações</button>
      <button type="button" role="tab" data-aba="ajustes" aria-selected="false">Treinar</button>
      <button type="button" role="tab" data-aba="agenda" aria-selected="false">Agenda</button>
    </div>
    <div id="aba-turno" class="painel"></div>
    <div id="aba-anotacoes" class="painel" hidden></div>
    <div id="aba-ajustes" class="painel" hidden></div>
    <div id="aba-agenda" class="painel" hidden></div>
    <p class="rodape">Usa o prompt (escopo só agendamento), as restrições e as regras de servidor da versão corrigida de 27/10. Agenda, links do Meet e envio são simulados; nada sai daqui.</p>
  </section>
</main>
<script type="module" src="./main.ts"></script>
</body>
</html>
